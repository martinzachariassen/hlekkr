# Railway deploy config for the web service — the only service with a public domain. It serves the
# static site and proxies everything else to the private API. In the Railway dashboard, set this
# service's root directory to `frontend` so this file and the Dockerfile are picked up.
#
# Required variables (see Caddyfile + Dockerfile):
#   API_UPSTREAM=api.railway.internal:8080   INTERNAL_API_KEY=<same value as the API service>
#   VITE_UMAMI_SRC / VITE_UMAMI_WEBSITE_ID   (optional build args; omit to ship zero analytics)

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
