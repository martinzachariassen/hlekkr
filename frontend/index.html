<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <title>Hlekkr — a link shortener that doesn't track you</title>
    <meta
      name="description"
      content="Paste a URL, get a short one back. No accounts, no logins — clicks are counted, never profiled. Built on a security-hardened Kotlin API."
    />
    <link rel="canonical" href="https://short.mlz.no/" />

    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/favicon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ecebe4" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hlekkr" />
    <meta property="og:url" content="https://short.mlz.no/" />
    <meta property="og:title" content="Hlekkr — a link shortener that doesn't track you" />
    <meta
      property="og:description"
      content="Paste a URL, get a short one back. No accounts, no logins — clicks are counted, never profiled."
    />
    <meta property="og:locale" content="en" />
    <meta property="og:image" content="https://short.mlz.no/assets/social/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hlekkr — a link shortener that doesn't track you" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hlekkr — a link shortener that doesn't track you" />
    <meta
      name="twitter:description"
      content="Paste a URL, get a short one back. No accounts, no logins — clicks are counted, never profiled."
    />
    <meta name="twitter:image" content="https://short.mlz.no/assets/social/twitter-card.png" />
    <meta name="twitter:image:alt" content="Hlekkr — a link shortener that doesn't track you" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Hlekkr",
        "url": "https://short.mlz.no/",
        "description": "Paste a URL, get a short one back. No accounts, no logins — clicks are counted, never profiled.",
        "inLanguage": "en"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
