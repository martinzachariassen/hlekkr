name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default; individual jobs elevate only what they need.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate: compiles everything and runs the full test suite — unit (MockK),
  # repository (Testcontainers against real Postgres), and end-to-end (Ktor test
  # client). Testcontainers uses the Docker daemon preinstalled on the runner.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build & test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  # Fails on any HIGH/CRITICAL CVE in declared dependencies (§2.11). Complements
  # dependency-review (PR-diff only) and Dependabot (reacts after merge) by
  # scanning the whole dependency graph on every push and PR.
  dependency-scan:
    name: dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress backend

  # Conventional Commits PR title (subject 1-72 chars). PR-only.
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # No `types` input: the action defaults to the standard Conventional Commits set
      # (feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert).
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          subjectPattern: ^.{1,72}$
          subjectPatternError: |
            PR title subject must be 1-72 characters (Conventional Commits).
