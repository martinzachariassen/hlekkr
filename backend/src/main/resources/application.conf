# Committed, non-secret defaults. Secrets arrive via ${?VAR} env substitution and are NEVER
# committed here; AppConfig fails fast at startup if a required one is absent.

server {
  # Railway's private network is IPv6-only: a service is only reachable at its `*.railway.internal`
  # address if it binds "::" (all IPv6 interfaces). Set SERVER_HOST=:: there. "0.0.0.0" for local runs.
  host = "0.0.0.0"
  host = ${?SERVER_HOST}
  port = 8080
  port = ${?PORT}
}

app {
  # Public base URL used to build shortUrls AND to reject self-referential targets (SSRF / loop abuse).
  baseUrl = "http://localhost:8080"
  baseUrl = ${?BASE_URL}

  maxBodyBytes = 16384          # 16 KB cap on POST /links bodies -> 413

  cors {
    # Comma-separated allow-list. Never "*" together with credentials.
    allowedOrigins = ""
    allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
  }

  # Shared secret the frontend sends as X-Internal-Key. Blank => management routes are open (dev).
  internalApiKey = ""
  internalApiKey = ${?INTERNAL_API_KEY}

  # Read the real client IP from X-Forwarded-For instead of the socket peer. Enable ONLY when a
  # trusted reverse proxy (Railway's edge) sits in front — otherwise a client could spoof the header
  # to dodge per-IP rate limiting. False for direct/local runs.
  trustProxyHeaders = false
  trustProxyHeaders = ${?TRUST_PROXY_HEADERS}

  rateLimit {
    # Token bucket per client IP. `capacity` = burst, `refillPerMinute` = sustained rate.
    create   { capacity = 10,  refillPerMinute = 10 }
    redirect { capacity = 120, refillPerMinute = 600 }
  }

  code {
    length = 7
    maxAttempts = 5             # bounded retry on collision, then fail closed
  }

  # Denylist of target domains to refuse, matched by domain suffix (an entry blocks the domain and
  # all subdomains). Ships empty. `hosts` is comma-separated inline; `file` points at a list (one
  # domain per line, or hosts-file format). See README.
  blocklist {
    hosts = ""
    hosts = ${?BLOCKED_HOSTS}
    file = ""
    file = ${?BLOCKED_HOSTS_FILE}
  }
}

db {
  url      = ${?DATABASE_URL}
  user     = ${?DATABASE_USER}
  password = ${?DATABASE_PASSWORD}

  maxPoolSize        = 10
  maxPoolSize        = ${?DB_MAX_POOL_SIZE}
  connectionTimeoutMs = 10000
  statementTimeoutMs  = 5000     # applied as Postgres `statement_timeout` per connection
}
