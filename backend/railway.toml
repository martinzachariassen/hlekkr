# Railway deploy config for the API service. In the Railway dashboard, set this service's
# root directory to `backend` so this file and the Dockerfile are picked up.
#
# This service stays PRIVATE — do not generate a public domain for it. It's reached only over the
# private network by the web service (the proxy). For that to work on Railway's IPv6 private
# network, set SERVER_HOST=:: (see application.conf). Health checks run on the internal address.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Readiness (DB-backed), not liveness, so a deploy only goes live once it can reach Postgres.
# The window covers a cold JVM start plus Flyway migrations against a possibly-waking DB; 30s was too
# tight on a fresh instance, so give first boot room rather than fail a healthy-but-slow deploy.
healthcheckPath = "/ready"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
