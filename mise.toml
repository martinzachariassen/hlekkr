[tools]
java = "temurin-25"
node = "24"
# Pinned (not "latest") so local and CI resolve identical deps; matches package.json packageManager.
pnpm = "10.11.0"

# DB creds come from the SAME source docker-compose uses (.env, else its dev defaults), so the app
# and the Postgres role can never drift apart.
[tasks._api]
hide = true
run = """
[ -f .env ] && set -a && . ./.env && set +a
: "${POSTGRES_DB:=shortener}"
: "${APP_DB_USER:=shortener_app}"
: "${APP_DB_PASSWORD:=dev_app_pw}"
: "${DB_ADMIN_USER:=shortener_admin}"
: "${DB_ADMIN_PASSWORD:=dev_admin_pw}"
docker compose up -d --wait db
# --no-daemon keeps the app JVM in this task's process group so `kill 0` reaps it on Ctrl-C;
# a daemon-forked JVM would survive and squat on :8080.
cd backend && \
  DATABASE_URL="jdbc:postgresql://localhost:5432/${POSTGRES_DB}" \
  DATABASE_USER="$APP_DB_USER" DATABASE_PASSWORD="$APP_DB_PASSWORD" \
  DATABASE_MIGRATION_USER="$DB_ADMIN_USER" DATABASE_MIGRATION_PASSWORD="$DB_ADMIN_PASSWORD" \
  BASE_URL="http://localhost:8080" \
  CORS_ALLOWED_ORIGINS="http://localhost:5173" \
  ./gradlew -q --console=plain --no-daemon run
"""

[tasks.dev]
description = "Run Postgres + API + web app together (Ctrl-C stops all)"
run = """
trap 'kill 0' EXIT INT TERM
mise run _api &
( cd frontend && pnpm install --silent && pnpm dev ) &
wait
"""

[tasks.backend]
description = "Run just the API from source against local Postgres"
run = "mise run _api"

[tasks.web]
description = "Run just the web app (expects the API already running)"
dir = "frontend"
run = "pnpm install --silent && pnpm dev"

[tasks.up]
description = "Run the whole stack in Docker (Postgres + migrations + API) on :8080"
run = "docker compose up --build"

[tasks.down]
description = "Stop the Docker stack and remove its volumes"
run = "docker compose down -v"

[tasks.logs]
description = "Tail the containerized API logs"
run = "docker compose logs -f api"

[tasks.test]
description = "Run the backend test suite (unit + Testcontainers + e2e)"
run = "cd backend && ./gradlew test"

[tasks.lint]
description = "Compile with all warnings as errors — the project's static-analysis gate"
run = "cd backend && ./gradlew compileKotlin compileTestKotlin"

[tasks.build]
description = "Build backend jar and frontend bundle"
run = """
cd backend && ./gradlew build
cd frontend && pnpm install --silent && pnpm build
"""

[tasks.clean]
description = "Remove backend build outputs"
run = "cd backend && ./gradlew clean"
